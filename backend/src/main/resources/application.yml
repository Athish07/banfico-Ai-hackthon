server:
  port: 8080

spring:
  application:
    name: hackathon-backend
  jackson:
    # Null fields are omitted rather than sent as null. Note in React that
    # e.g. changeVsPreviousMonth is ABSENT, not null, when there is no baseline.
    default-property-inclusion: non_null

# ── Bank service account ─────────────────────────────────────────────────────
# This is the sandbox credential your app uses to call the bank. It is NOT the
# credential your portal users log in with (see app.portal-* below).
#
# Values default to what was already here so nothing breaks, but every one can be
# overridden by an env var. Prefer that: this file is in git, and the password has
# already travelled through a zip file.
bank:
  domain: ${BANK_DOMAIN:obiebank-sbx.banfico.io}
  tenant: ${BANK_TENANT:provider}
  client-id: ${BANK_CLIENT_ID:corebank-spa}
  client-secret: ${BANK_CLIENT_SECRET:corebank-spa-password}
  username: ${BANK_USERNAME:nivas.ganesan+aihackathonteamf@banfico.com}
  password: ${BANK_PASSWORD:KWRB@(7h2Gk2L1(8daiw}

# ── Portal login (your own login page) ───────────────────────────────────────
app:
  portal-username: ${PORTAL_USERNAME:nivas.ganesan+aihackathonteamf@banfico.com}
  portal-password: ${PORTAL_PASSWORD:KWRB@(7h2Gk2L1(8daiw}
  session-ttl-minutes: 480
  cors-origins:
    - http://localhost:5173
    - http://localhost:3000

# ── AI layer ─────────────────────────────────────────────────────────────────
#   export ANTHROPIC_API_KEY=sk-ant-...
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-5
  max-tokens: 1024

logging:
  level:
    com.banfico: DEBUG
